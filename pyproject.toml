[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pagared-prueba-tecnica"
version = "0.1.0"
description = "Pipeline ETL, modelo dimensional y reporte diario de ventas para PagaRed S.A.S."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Uso exclusivo del proceso de selección" }
authors = [{ name = "Jhon E." }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Private :: Do Not Upload",
]
dependencies = [
    "pandas>=2.2",
    "openpyxl>=3.1",
]

[project.scripts]
pagared-etl = "etl.cli:main"
pagared-consultas = "etl.consultas:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "gherkin-official>=43.0",
    "markdown>=3.6",
    "pypdf>=5.0",
]

[tool.setuptools]
package-dir = { "" = "parte-2-b2-pipeline" }

[tool.setuptools.packages.find]
where = ["parte-2-b2-pipeline"]
include = ["etl*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["parte-2-b2-pipeline/tests", "parte-4-b4-revision/tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["parte-2-b2-pipeline", "parte-3-b3-sql", "parte-4-b4-revision"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"parte-2-b2-pipeline/tests/*" = ["S101"]
"parte-4-b4-revision/tests/*" = ["S101"]
